# This file controls the settings for your Quarto template from www.marvinschmitt.com

# website settings
website:
  title: "Andrew Qian"                                # Your name
  description: "Student in the Clinical Research Scholars Program at Case Western Reserve University "   # A brief slogan (optional)
  image: img/my_image.jpg
  
  favicon: img/favicon.png
  
  # start of the navigation bar at the top of the website
  navbar:
    pinned: true
    logo: /img/logo.png
    
    # your sub-pages
    left:
      - text: "Projects"
        href: projects/index.qmd
      - text: "CV"
        href: cv/index.qmd
    
    # your social media handles
    right:
      - icon: linkedin
        href: https://www.linkedin.com/in/andrewgqian
      - icon: envelope
        aria-label: email
        href: "mailto:mail.andrewqian12@gmail.com"  
  
  

# Don't touch unless you know what you are doing :) ------------
  search: 
    location: navbar
    type: textbox
  page-footer: 
    left: |
      2026 Andrew Qian</span>
    right: |
      <span class="faux-block">Template by <a href="https://github.com/marvinschmitt/quarto-website-template/">Marvin Schmitt</a>, CC BY-SA 4.0</span>


project:
  type: website
  output-dir: docs

  preview: 
    port: 22222
    browser: true
    watch-inputs: true
    navigate: true

execute:
  freeze: true

format:
  html:
    fontsize: 1.1em
    theme: 
      - pulse
      - html/styles.scss
    toc: false
    code-link: true
    anchor-sections: true
    fig-cap-location: margin
    reference-location: margin
    footnotes-hover: true